- name: SG rules
  sg: 
  - expense-dev-db
  - expense-dev-backend
  - expense-dev-frontend
  - expense-dev-bastion
  - expense-dev-app-alb   #backend alb
  - expense-dev-vpn

  expense-dev-vpn:
  - name: vpn_public
    desc: vpc accepting connection from public
    source: public
    port: 943, 443, 22, 1194
  
  db:
  - name: db_backend
    desc: db accepting connections from backend
    source: backend
    port: 3306
  - name: db_bastion
    desc: db accepting connections from bastion
    source: bastion
    port: 3306
  - name: db_vpn
    desc: db accepting connections from vpn
    source: vpn
    port: 3306

  app_alb:
  - name: app_alb
    desc: app_alb accepting connections from vpn
    source: vpn
    port: 80

  backend:
  - name: backend_app_alb
    desc: backend accepting connection from app alb
    source: app_alb
    port: 8080
  - name: backend_bastion
    desc: backend accepting connections from bastion
    source: bastion
    port: 22
  - name: backend_vpn_ssh
    desc: backend accepting connections from vpn
    source: vpn
    port: 22
  - name: backend_vpn_http
    desc: backend accepting connections from vpn
    source: vpn
    port: 8080

  frontend:
  - name: frontend_public
    desc: frontend accepting connection from frontend_public
    source: public
    port: 80
  - name: frontend_bastion
    desc: frontend accepting connection from bastion
    source: bastion
    port: 22

  web_alb:
  - name: web_alb_public
    desc: web_alb accepting connections from public
    source: public
    port: 80
  - name: web_alb_public
    desc: web_alb accepting connections from public
    source: public
    port: 443
  vpn:
  - name: vpn_public  
    desc: vpn accepting connection from public
    source: public
    port: 943, 443, 22, 1194
  
  bastion:
  - name: bastion_public
    desc: bastion accepting connection from public
    source: public #idealy your home IP adress/32
    port: 22
